version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: apnisociety_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: apnisociety_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d apnisociety_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: apnisociety_fastapi
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@db:5432/apnisociety_db
      SECRET_KEY: apnisociety_production_secret_key_2026
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: always

volumes:
  pgdata:
